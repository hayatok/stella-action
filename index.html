<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ステラ・アクション</title>
  </head>
  <body>
    <main id="game">
      <div id="hud">
        <h1>ステラ・アクション</h1>
        <p id="progress" aria-live="polite"></p>
        <p id="fallback" hidden>モデルを読み込めなかったため、ダミーを表示しています。</p>
      </div>
      <p id="debug-state">STATE: Idle / GROUND</p>
      <p id="controls">WASD / 矢印 移動 · Shift ダッシュ · Space ジャンプ · J / 左クリック 攻撃 · ドラッグ 視点</p>
      <div id="touch" hidden>
        <div id="stick-area"><div id="stick" hidden><div id="knob"></div></div></div>
        <div id="touch-buttons">
          <button id="jump" type="button">JUMP</button>
          <button id="attack" type="button">ATK</button>
        </div>
      </div>
      <div id="clear" hidden>
        <h2>CLEAR!</h2>
        <button id="restart" type="button">リスタート</button>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
